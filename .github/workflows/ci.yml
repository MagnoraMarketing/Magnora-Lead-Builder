name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        # The build must succeed without any Supabase configuration: a missing
        # variable renders the /setup page rather than throwing.
        run: npm run build

  worker:
    name: Scraper worker (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No browser is installed: every test here runs against fixture HTML and
      # fakes, so the suite stays fast and needs no network.
      - name: Tests
        run: pytest -q

  database:
    name: Database (migrations, dedupe, queue, RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Apply migrations and run the schema test suite
        # Run as the runner user, not via sudo: initdb refuses to run as root,
        # and the postgres user cannot traverse into the runner's home anyway.
        env:
          PGBIN: /usr/lib/postgresql/16/bin
          PGPORT: '5433'
        run: ./scripts/test-db.sh
